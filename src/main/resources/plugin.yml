name: MorniParty
version: '${project.version}'
main: net.morni.party.PartyPlugin
api-version: '1.21'
description: Morni Party für das Netzwerk morni.net – Brettspiel für 2–8 mit Edelweiß, Talern und vielen Minispielen.
authors: [morni.net]
website: https://morni.net
# Läuft mit dem Netzwerk-Plugin (Sprache, Party, Statistik) und auch allein.
softdepend: [MorniNet]

commands:
  mitspielen:
    description: Für die nächste Partie anmelden
    usage: /mitspielen
    aliases: [spielen, play]
  verlassen:
    description: Warteschlange, Partie oder Zuschauen verlassen
    usage: /verlassen
    aliases: [leave, raus]
  zuschauen:
    description: Einer laufenden Partie zuschauen
    usage: /zuschauen [spieler]
    aliases: [spectate, spec]
  stats:
    description: Statistik ansehen
    usage: /stats [spieler]
    aliases: [statistik]
  top:
    description: Bestenliste
    usage: /top
    aliases: [bestenliste, rangliste]
  mparty:
    description: Verwaltung von Morni Party
    usage: /mparty <info|zustand|start|stopp|wuerfel|taler|edelweiss|feld|stand|gegenstand|minispiel|neubauen|neuladen>
    permission: morninet.party.admin

permissions:
  morninet.party.admin:
    description: Morni Party verwalten und im Kreativmodus in der Party-Welt bauen
    default: op
